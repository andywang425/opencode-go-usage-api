# Copy this file to config.toml and ensure only the service user can read it: chmod 600 config.toml

[server]
# Third-party requests use Authorization: Bearer <token>
api_token = "replace-with-a-strong-random-token"
host = "0.0.0.0"
port = 18443

# Both fields must be set together or left both empty; when empty, HTTP is used
ssl_certfile = ""
ssl_keyfile = ""

[fetch]
timeout = 10
retries = 1
locale = "en"
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36"

[response]
# Leave empty to use the default format below; unknown placeholders are preserved as-is
data_template = "Rolling {rolling_percent}% ({rolling_reset}) | Weekly {weekly_percent}% ({weekly_reset}) | Monthly {monthly_percent}% ({monthly_reset})"

[account]
# The default account must be set explicitly even if you only configure one
default = "main"

# Account IDs allow letters, digits, _, -, up to 64 chars, and are case-sensitive
[accounts.main]
auth_cookie = "replace-with-main-auth-cookie"
workspace_id = "wrk_main"

[accounts.backup]
auth_cookie = "replace-with-backup-auth-cookie"
workspace_id = "wrk_backup"
