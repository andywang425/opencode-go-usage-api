[project]
name = "opencode-go-usage-api"
version = "0.1.0"
description = "实时抓取 OpenCode Go 工作区页面并返回用量 JSON 的 HTTPS API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
opencode-go-usage-api = "opencode_go_usage_api.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencode_go_usage_api"]
