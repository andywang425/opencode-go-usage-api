[project]
name = "opencode-go-usage-api"
version = "0.1.0"
description = "HTTPS API that live-scrapes the OpenCode Go workspace page and returns usage as JSON"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "httpx2>=2.7.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
opencode-go-usage-api = "opencode_go_usage_api.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencode_go_usage_api"]
